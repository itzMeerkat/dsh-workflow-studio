# Add Workflow Studio to the official global panel composition. The nodes row
# registers Studio's general-purpose nodes; the demo row registers the example
# nodes. Disable either row to leave its nodes out.
- insert:
    - id: workflow-studio
      name: dsh-workflow-studio
    - id: workflow-studio-nodes
      name: dsh-workflow-studio/nodes
    - id: workflow-studio-demo
      name: dsh-workflow-studio/demo
